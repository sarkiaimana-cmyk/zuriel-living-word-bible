name: Build Zuriel Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "bible-data.js"
      - "zuriel-*.js"
      - "sw.js"
      - "kjv.72bec70fcd.json"
      - "images/**"
      - "package.json"
      - "capacitor.config.ts"
      - "scripts/**"
      - ".github/workflows/android-apk.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out Zuriel
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools platforms;android-36 build-tools;36.0.0"

      - name: Install Capacitor
        run: npm install

      - name: Prepare offline web app
        run: npm run build:web

      - name: Check whether release signing is configured
        id: signing_check
        env:
          ZURIEL_KEYSTORE_BASE64: ${{ secrets.ZURIEL_KEYSTORE_BASE64 }}
          ZURIEL_KEYSTORE_PASSWORD: ${{ secrets.ZURIEL_KEYSTORE_PASSWORD }}
          ZURIEL_KEY_ALIAS: ${{ secrets.ZURIEL_KEY_ALIAS }}
          ZURIEL_KEY_PASSWORD: ${{ secrets.ZURIEL_KEY_PASSWORD }}
        shell: bash
        run: |
          if [[ -n "$ZURIEL_KEYSTORE_BASE64" && -n "$ZURIEL_KEYSTORE_PASSWORD" && -n "$ZURIEL_KEY_ALIAS" && -n "$ZURIEL_KEY_PASSWORD" ]]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
            echo "Stable release signing secrets are configured."
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "Stable signing is not configured yet; building the existing debug APK only."
          fi

      - name: Generate Android project
        env:
          ZURIEL_ANDROID_APP_ID: ${{ steps.signing_check.outputs.available == 'true' && 'com.zuriel.livingwordbible.release' || 'com.zuriel.livingwordbible.github' }}
        run: npx cap add android

      - name: Sync Android project
        env:
          ZURIEL_ANDROID_APP_ID: ${{ steps.signing_check.outputs.available == 'true' && 'com.zuriel.livingwordbible.release' || 'com.zuriel.livingwordbible.github' }}
        run: npx cap sync android

      - name: Build standalone debug APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Prepare signed release APK
        if: steps.signing_check.outputs.available == 'true'
        working-directory: android
        env:
          ZURIEL_KEYSTORE_BASE64: ${{ secrets.ZURIEL_KEYSTORE_BASE64 }}
          ZURIEL_KEYSTORE_PASSWORD: ${{ secrets.ZURIEL_KEYSTORE_PASSWORD }}
          ZURIEL_KEY_ALIAS: ${{ secrets.ZURIEL_KEY_ALIAS }}
          ZURIEL_KEY_PASSWORD: ${{ secrets.ZURIEL_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          KEYSTORE="$RUNNER_TEMP/zuriel-release.jks"
          # Ignore whitespace or stray clipboard characters, then validate the
          # decoded PKCS12 keystore and expected alias before attempting signing.
          python3 - <<'PY'
          import base64, os
          raw = os.environ["ZURIEL_KEYSTORE_BASE64"]
          alphabet = "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789+/"
          clean = "".join(ch for ch in raw if ch in alphabet)
          clean = clean.rstrip("=")
          clean += "=" * ((-len(clean)) % 4)
          data = base64.b64decode(clean, validate=True)
          if not data:
              raise SystemExit("The configured keystore secret decoded to an empty file.")
          with open(os.environ["RUNNER_TEMP"] + "/zuriel-release.jks", "wb") as output:
              output.write(data)
          PY
          test -s "$KEYSTORE"
          keytool -list -keystore "$KEYSTORE" -storetype PKCS12 \
            -storepass "$ZURIEL_KEYSTORE_PASSWORD" \
            -alias "$ZURIEL_KEY_ALIAS" >/dev/null
          ./gradlew assembleRelease
          BUILD_TOOLS="$ANDROID_HOME/build-tools/36.0.0"
          UNSIGNED="app/build/outputs/apk/release/app-release-unsigned.apk"
          ALIGNED="$RUNNER_TEMP/zuriel-release-aligned.apk"
          OUTPUT="app/build/outputs/apk/release/Zuriel-Living-Word-Bible-release.apk"
          "$BUILD_TOOLS/zipalign" -v -p 4 "$UNSIGNED" "$ALIGNED"
          "$BUILD_TOOLS/apksigner" sign \
            --ks "$KEYSTORE" \
            --ks-key-alias "$ZURIEL_KEY_ALIAS" \
            --ks-pass env:ZURIEL_KEYSTORE_PASSWORD \
            --key-pass env:ZURIEL_KEY_PASSWORD \
            --out "$OUTPUT" "$ALIGNED"
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$OUTPUT"
          rm -f "$KEYSTORE" "$ALIGNED"

      - name: Upload Zuriel debug APK
        if: steps.signing_check.outputs.available != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: Zuriel-Living-Word-Bible-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload signed Zuriel release APK
        if: steps.signing_check.outputs.available == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: Zuriel-Living-Word-Bible-Signed-APK
          path: android/app/build/outputs/apk/release/Zuriel-Living-Word-Bible-release.apk
          if-no-files-found: error
          retention-days: 30
