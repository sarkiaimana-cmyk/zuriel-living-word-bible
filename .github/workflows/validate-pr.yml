name: Validate Zuriel changes

on:
  push:
    branches: [main, fix/open-book-studio-svg-uri-regex, qa/offline-service-worker-runtime-integrated]
  pull_request:
    branches: [main, fix/open-book-studio-svg-uri-regex]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install project dependencies
        run: npm install

      - name: Prepare offline web app
        run: npm run build:web

      - name: Verify offline core assets and local script precache
        run: node scripts/check-offline-core-assets.mjs

      - name: Exercise offline service-worker runtime and recovery
        run: node scripts/test-service-worker-runtime.mjs

      - name: Verify complete offline KJV corpus counts
        run: node scripts/check-kjv-corpus-counts.mjs

      - name: Validate secure online translation reader
        run: node scripts/check-translations-reader.mjs

      - name: Test translation-only Worker route isolation
        run: node --test ai-worker/test/translation-worker.test.mjs ai-worker/test/api-bible.test.mjs

      - name: Validate manual YouVersion deployment workflow
        run: node scripts/check-translation-deploy-workflow.mjs

      - name: Syntax-check application JavaScript
        run: for file in *.js; do node --check "$file"; done

      - name: Syntax-check AI pilot Worker
        run: node --check ai-worker/src/index.js

      - name: Test AI pilot privacy and request safeguards
        run: node --test ai-worker/test/*.test.mjs

      - name: Verify all KJV source assets for AI pilot
        run: node ai-worker/scripts/prepare-scripture-assets.mjs --check

      - name: Validate streamlined home dashboard and distinct sections
        run: node scripts/check-home-dashboard.mjs

      - name: Validate top interactive Bible translations
        run: node scripts/check-home-translations.mjs

      - name: Validate continuous identity Scripture hero
        run: node scripts/check-identity-scripture-hero.mjs

      - name: Validate study safeguards
        run: node scripts/check-study-integrity.mjs

      - name: Validate compact selected-verse action menu
        run: node scripts/check-selected-verse-menu.mjs

      - name: Validate offline Scripture read-aloud and selected-verse resume
        run: node scripts/check-audio-reader.mjs
      - name: Validate offline Bible search
        run: node scripts/check-bible-search.mjs
      - name: Validate offline Hebrew and Greek lexicon index
        run: node scripts/check-lexicon-study-index.mjs

      - name: Audit verse-specific faith response coverage
        run: npm run study:faith-coverage

      - name: Test AI pilot backend security
        run: node --test ai-worker/test/worker.test.mjs

      - name: Check AI client/backend boundary
        run: node scripts/check-ai-worker-boundary.mjs

      - name: Exercise original-language resource cache
        run: node scripts/test-study-resource-cache.mjs
      - name: Validate reader navigation and selected verses
        run: node scripts/check-reader-navigation.mjs
      - name: Validate Recently Opened reading history
        run: node scripts/check-recent-history.mjs
      - name: Test exact KJV original-word linking
        run: node scripts/test-original-word-linking.mjs
      - name: Validate responsive contextual word-study panel
        run: node scripts/check-word-study-layout.mjs
      - name: Validate full-width Scripture reading layout
        run: node scripts/check-scripture-reading-layout.mjs
      - name: Validate KJV paragraph formatting
        run: node scripts/check-kjv-paragraph-formatting.mjs
      - name: Validate exact study reference navigation
        run: node scripts/check-study-reference-navigation.mjs
      - name: Validate Advanced Bible Study topical index
        run: node scripts/check-topical-study-index.mjs
      - name: Validate expanded offline study library integration
        run: node scripts/check-expanded-study-library.mjs
      - name: Test Android version metadata
        run: node scripts/test-android-version.mjs

      - name: Validate signed Android in-place upgrade safeguards
        run: |
          bash -n scripts/smoke-test-android-upgrade.sh
          node scripts/check-android-upgrade-smoke.mjs

      - name: Validate guided growth and personal space
        run: node scripts/check-growth-pathways.mjs

      - name: Validate offline reading plan integration
        run: node scripts/check-reading-plans.mjs

      - name: Test reading plan progress and references
        run: node scripts/test-reading-plans.mjs

      - name: Validate opt-in offline local reminders
        run: node scripts/check-local-notifications.mjs

      - name: Validate Personal Study Space chapter history integration
        run: node scripts/check-personal-space-history.mjs

      - name: Validate personal backup and restore
        run: node scripts/check-personal-backup.mjs

      - name: Exercise encrypted backup runtime
        run: node scripts/test-personal-backup-runtime.mjs

      - name: Exercise Personal Study Space storage runtime
        run: node scripts/test-personal-space-runtime.mjs

      - name: Validate Bible book introductions
        run: node scripts/check-book-introductions.mjs

      - name: Validate offline Bible Geography Centre
        run: node scripts/check-bible-geography.mjs

      - name: Validate Words of Jesus study centre
        run: node scripts/check-words-of-jesus.mjs

      - name: Validate Open Book Card Studio
        run: node scripts/check-open-book-studio.mjs

      - name: Validate native Gallery export and web fallback
        run: node scripts/check-gallery-save.mjs

      - name: Validate Dictionary and Commentary reference library
        run: node scripts/check-reference-library.mjs

      - name: Validate worship audio rights gate
        run: node scripts/check-worship-rights.mjs
