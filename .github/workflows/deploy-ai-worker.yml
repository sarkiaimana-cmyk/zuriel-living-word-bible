name: Deploy Zuriel AI pilot (manual)

on:
  workflow_dispatch:
    inputs:
      confirm_deployment:
        description: Confirm that the Cloudflare Free plan, model quota and Turnstile widget have been checked
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: zuriel-ai-pilot-deployment
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ inputs.confirm_deployment == true }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai-worker
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      TURNSTILE_SECRET: ${{ secrets.TURNSTILE_SECRET }}
      ZITE_YVP_APP_KEY: ${{ secrets.ZITE_YVP_APP_KEY }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check deployment credentials and public widget configuration
        run: |
          set -eu
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "::error::Missing CLOUDFLARE_API_TOKEN repository secret."; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "::error::Missing CLOUDFLARE_ACCOUNT_ID repository secret."; exit 1; }
          test -n "$TURNSTILE_SECRET" || { echo "::error::Missing TURNSTILE_SECRET repository secret."; exit 1; }
          node -e 'const fs=require("node:fs"); const c=JSON.parse(fs.readFileSync("wrangler.jsonc","utf8")); if(!c.vars?.TURNSTILE_SITE_KEY || !c.vars?.TURNSTILE_HOSTNAMES || !c.vars?.ALLOWED_ORIGINS) { console.error("Set TURNSTILE_SITE_KEY, TURNSTILE_HOSTNAMES and ALLOWED_ORIGINS in wrangler.jsonc first."); process.exit(1); }'

      - name: Install Worker deployment tools
        run: npm install --no-audit --no-fund

      - name: Test AI backend safeguards
        run: npm test

      - name: Verify the complete KJV source
        run: npm run check:scripture

      - name: Set the server-only Turnstile secret
        run: printf '%s' "$TURNSTILE_SECRET" | npx wrangler secret put TURNSTILE_SECRET

      - name: Set the optional server-side YouVersion app key
        if: env.ZITE_YVP_APP_KEY != ''
        run: printf '%s' "$ZITE_YVP_APP_KEY" | npx wrangler secret put ZITE_YVP_APP_KEY

      - name: Generate KJV chapter assets and deploy Worker
        run: npm run deploy
