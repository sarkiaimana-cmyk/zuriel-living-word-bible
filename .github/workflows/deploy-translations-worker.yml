name: Deploy Zuriel Bible translations proxy (manual)

on:
  workflow_dispatch:
    inputs:
      confirm_deployment:
        description: Confirm Cloudflare Workers plan and all configured Bible-provider licences have been checked
        required: true
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: zuriel-translations-proxy-deployment
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ inputs.confirm_deployment == true }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai-worker
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      ZITE_YVP_APP_KEY: ${{ secrets.ZITE_YVP_APP_KEY }}
      API_BIBLE_KEY: ${{ secrets.API_BIBLE_KEY }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check translation deployment credentials
        run: |
          set -eu
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "::error::Missing CLOUDFLARE_API_TOKEN repository secret."; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "::error::Missing CLOUDFLARE_ACCOUNT_ID repository secret."; exit 1; }
          test -n "$ZITE_YVP_APP_KEY" || { echo "::error::Missing ZITE_YVP_APP_KEY repository secret."; exit 1; }
          node -e 'const fs=require("node:fs"); const c=JSON.parse(fs.readFileSync("wrangler.translations.jsonc","utf8")); if(!c.vars?.ALLOWED_ORIGINS || !c.ratelimits?.some(x=>x.name==="TRANSLATION_RATE_LIMIT")) { console.error("Translation proxy origin or rate-limit configuration is missing."); process.exit(1); }'

      - name: Install Worker deployment tools
        run: npm install --no-audit --no-fund

      - name: Test translation proxy safeguards
        run: node --test test/youversion.test.mjs test/translation-worker.test.mjs test/api-bible.test.mjs

      - name: Confirm the Cloudflare token account
        run: npx wrangler whoami

      - name: Bootstrap the fail-closed Worker
        run: |
          set -euo pipefail
          umask 077
          trap 'rm -f .wrangler.translations.bootstrap.jsonc' EXIT
          node -e 'const fs=require("node:fs"); const c=JSON.parse(fs.readFileSync("wrangler.translations.jsonc","utf8")); delete c.secrets; fs.writeFileSync(".wrangler.translations.bootstrap.jsonc", JSON.stringify(c,null,2)+"\n", {mode:0o600, flag:"wx"});'
          if ! npx wrangler deploy --config .wrangler.translations.bootstrap.jsonc; then
            echo "::error::Cloudflare rejected the initial Worker deployment. Check that CLOUDFLARE_ACCOUNT_ID belongs to the account included in the API token and that the token can create Workers at the Workers product scope."
            exit 1
          fi

      - name: Install the YouVersion app key as a Worker secret
        run: |
          set -euo pipefail
          if ! printf '%s' "$ZITE_YVP_APP_KEY" | npx wrangler secret put ZITE_YVP_APP_KEY --config wrangler.translations.jsonc; then
            echo "::error::Cloudflare rejected the Worker secret operation. Check the token's account scope and grant Workers Scripts Write (or Workers Editor for this Worker). Do not create another YouVersion key for this permission error."
            exit 1
          fi

      - name: Install optional API.Bible key as a Worker secret
        run: |
          set -euo pipefail
          if [ -n "$API_BIBLE_KEY" ]; then
            if ! printf '%s' "$API_BIBLE_KEY" | npx wrangler secret put API_BIBLE_KEY --config wrangler.translations.jsonc; then
              echo "::error::Cloudflare rejected the optional API.Bible secret. Check the Worker secret permissions; the key is never printed."
              exit 1
            fi
            echo "API.Bible server-side key installed."
          else
            echo "::notice::API.Bible key not configured; its provider will remain unavailable while YouVersion can still operate."
          fi

      - name: Deploy the protected translation Worker
        run: |
          set -euo pipefail
          if ! npx wrangler deploy --config wrangler.translations.jsonc; then
            echo "::error::The final Worker deployment failed after secret installation. Review the Cloudflare account and Worker permissions; the YouVersion key is not printed by this workflow."
            exit 1
          fi

      - name: Discover Worker URL and smoke-test YouVersion access
        run: |
          set -euo pipefail
          trap 'rm -f .translation-smoke.json .translation-smoke.headers .api-bible-smoke.json .api-bible-smoke.headers' EXIT

          SUBDOMAIN_JSON="$(curl -fsS --retry 4 --retry-delay 2 --retry-all-errors \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/subdomain")"
          WORKERS_SUBDOMAIN="$(printf '%s' "$SUBDOMAIN_JSON" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const j=JSON.parse(s);if(!j.success||!j.result?.subdomain)process.exit(1);process.stdout.write(j.result.subdomain);});')"
          if [ -z "$WORKERS_SUBDOMAIN" ]; then
            echo "::error::Cloudflare did not return a workers.dev subdomain. Enable the account workers.dev subdomain and rerun deployment."
            exit 1
          fi

          SCRIPT_SUBDOMAIN_JSON="$(curl -fsS --retry 4 --retry-delay 2 --retry-all-errors \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/zuriel-bible-translations/subdomain")"
          SCRIPT_ENABLED="$(printf '%s' "$SCRIPT_SUBDOMAIN_JSON" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const j=JSON.parse(s);process.stdout.write(String(Boolean(j.result?.enabled)));});')"
          if [ "$SCRIPT_ENABLED" != "true" ]; then
            echo "::error::The Worker workers.dev route is not enabled. Enable it for zuriel-bible-translations in Cloudflare and rerun this workflow."
            exit 1
          fi

          WORKER_URL="https://zuriel-bible-translations.$WORKERS_SUBDOMAIN.workers.dev"
          HTTP_STATUS="$(curl -sS --retry 5 --retry-delay 3 --retry-all-errors \
            -o .translation-smoke.json -D .translation-smoke.headers -w '%{http_code}' \
            -H "Origin: https://sarkiaimana-cmyk.github.io" \
            "$WORKER_URL/api/youversion/bibles")"
          if [ "$HTTP_STATUS" != "200" ]; then
            echo "::error::The deployed YouVersion endpoint returned HTTP $HTTP_STATUS. Check the YouVersion app key, publisher access and Worker logs."
            exit 1
          fi
          if ! grep -qi 'access-control-allow-origin: https://sarkiaimana-cmyk.github.io' .translation-smoke.headers; then
            echo "::error::The translation Worker did not return the expected GitHub Pages CORS origin."
            exit 1
          fi

          VERSION_COUNT="$(node -e 'const j=JSON.parse(require("node:fs").readFileSync(".translation-smoke.json","utf8"));if(!Array.isArray(j.data))process.exit(1);process.stdout.write(String(j.data.length));')"
          if [ "$VERSION_COUNT" -lt 1 ]; then
            echo "::error::The YouVersion app key returned no publisher-authorised English Bible versions. Check the app registration and publisher access before activating the app endpoint."
            exit 1
          fi

          if [ -n "$API_BIBLE_KEY" ]; then
            API_BIBLE_STATUS="$(curl -sS --retry 3 --retry-delay 2 --retry-all-errors \
              -o .api-bible-smoke.json -D .api-bible-smoke.headers -w '%{http_code}' \
              -H "Origin: https://sarkiaimana-cmyk.github.io" \
              "$WORKER_URL/api/api-bible/bibles")"
            if [ "$API_BIBLE_STATUS" != "200" ]; then
              echo "::error::The optional API.Bible provider returned HTTP $API_BIBLE_STATUS. Check the API_BIBLE_KEY secret and its account access."
              exit 1
            fi
            if ! grep -qi 'access-control-allow-origin: https://sarkiaimana-cmyk.github.io' .api-bible-smoke.headers; then
              echo "::error::The API.Bible provider did not return the expected GitHub Pages CORS origin."
              exit 1
            fi
            API_BIBLE_COUNT="$(node -e 'const j=JSON.parse(require("node:fs").readFileSync(".api-bible-smoke.json","utf8"));if(!Array.isArray(j.data))process.exit(1);process.stdout.write(String(j.data.length));')"
            if [ "$API_BIBLE_COUNT" -lt 1 ]; then
              echo "::warning::API.Bible key is valid but currently returns no English Bible versions. YouVersion remains available."
            fi
            echo "API.Bible English versions returned: $API_BIBLE_COUNT"
          else
            echo "API.Bible is optional and was not configured; YouVersion remains the active provider."
          fi
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::Run this deployment from the main branch so the verified endpoint can be saved to the app configuration."
            exit 1
          fi

          # The endpoint is public configuration, not a credential. The YouVersion
          # app key remains a Cloudflare secret and is never written to GitHub.
          export WORKER_URL
          node -e 'const fs=require("node:fs");const path="../version.json";const data=JSON.parse(fs.readFileSync(path,"utf8"));data.translationApiBase=process.env.WORKER_URL;fs.writeFileSync(path,JSON.stringify(data,null,2)+"\n");'
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ../version.json
          if ! git diff --cached --quiet; then
            git commit -m "Connect verified YouVersion translation proxy endpoint"
            if ! git push origin HEAD:main; then
              echo "::error::The Worker passed its live smoke test, but GitHub did not accept the automatic endpoint configuration commit. The public endpoint is $WORKER_URL; the app remains safely on offline KJV until version.json is updated."
              exit 1
            fi
          fi

          REMOTE_CONFIG="$(curl -fsS --retry 3 --retry-delay 2 --retry-all-errors \
            "https://raw.githubusercontent.com/sarkiaimana-cmyk/zuriel-living-word-bible/main/version.json")"
          SAVED_ENDPOINT="$(printf '%s' "$REMOTE_CONFIG" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const j=JSON.parse(s);process.stdout.write(String(j.translationApiBase||""));});')"
          if [ "$SAVED_ENDPOINT" != "$WORKER_URL" ]; then
            echo "::error::The Worker is live, but the app's public endpoint configuration could not be verified."
            exit 1
          fi

          echo "::notice title=YouVersion proxy deployed and configured::$WORKER_URL"
          echo "Worker URL: $WORKER_URL"
          echo "Authorised Bible versions returned: $VERSION_COUNT"
          echo "Zuriel will discover this verified endpoint from version.json; no API key is exposed in the app."
