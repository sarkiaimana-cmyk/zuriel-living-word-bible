name: Deploy Zuriel Bible translations proxy (manual)

on:
  workflow_dispatch:
    inputs:
      confirm_deployment:
        description: Confirm Cloudflare Workers Free plan and YouVersion publisher access have been checked
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: zuriel-translations-proxy-deployment
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ inputs.confirm_deployment == true }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai-worker
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      ZITE_YVP_APP_KEY: ${{ secrets.ZITE_YVP_APP_KEY }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check translation deployment credentials
        run: |
          set -eu
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "::error::Missing CLOUDFLARE_API_TOKEN repository secret."; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "::error::Missing CLOUDFLARE_ACCOUNT_ID repository secret."; exit 1; }
          test -n "$ZITE_YVP_APP_KEY" || { echo "::error::Missing ZITE_YVP_APP_KEY repository secret."; exit 1; }
          node -e 'const fs=require("node:fs"); const c=JSON.parse(fs.readFileSync("wrangler.translations.jsonc","utf8")); if(!c.vars?.ALLOWED_ORIGINS || !c.ratelimits?.some(x=>x.name==="TRANSLATION_RATE_LIMIT")) { console.error("Translation proxy origin or rate-limit configuration is missing."); process.exit(1); }'

      - name: Install Worker deployment tools
        run: npm install --no-audit --no-fund

      - name: Test translation proxy safeguards
        run: node --test test/youversion.test.mjs test/translation-worker.test.mjs

      - name: Deploy translation-only Worker with server-only YouVersion key
        run: |
          set -eu
          umask 077
          trap 'rm -f .zuriel-translation-secrets.json' EXIT
          node -e 'const fs=require("node:fs"); const key=process.env.ZITE_YVP_APP_KEY; if(typeof key!=="string" || !key.trim()) { console.error("YouVersion app key is missing."); process.exit(1); } fs.writeFileSync(".zuriel-translation-secrets.json", JSON.stringify({ZITE_YVP_APP_KEY:key}), {mode:0o600, flag:"wx"});'
          npx wrangler deploy --config wrangler.translations.jsonc --secrets-file .zuriel-translation-secrets.json
